[package]
name = "spotuify"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
crossterm = "0.29.0"
dotenvy = "0.15.7"
open = "5.4.4"
rand = "0.10.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12.0"
tokio = { version = "1", features = ["full"] }
url = "2.5.8"
